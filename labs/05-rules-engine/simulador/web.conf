# Nginx sirve la interfaz y, además, hace de puente hacia el broker.
#
# POR QUÉ ESTO EXISTE
#   El navegador necesita hablar MQTT sobre WebSockets con Mosquitto. La
#   forma obvia sería publicar el puerto 9001 del broker en tu máquina y
#   conectarse ahí. Funciona... hasta que ese puerto está ocupado.
#
#   Y en Windows se ocupa solo: Hyper-V se reserva bloques de 100 puertos
#   al azar en cada arranque, y si te toca el 9001 Docker no puede abrirlo.
#   El error es «bind: Intento de acceso a un socket no permitido», que no
#   suena para nada a lo que es.
#
#   Así que no publicamos el 9001. El navegador se conecta al MISMO puerto
#   de la web, en la ruta /mqtt, y nginx reenvía la conexión al broker por
#   la red interna de Docker. Un solo puerto que pueda chocar en vez de
#   tres, y el alumno no tiene que configurar nada en dos sitios.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La interfaz: archivos estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    # El puente al broker. La barra final de proxy_pass es importante:
    # convierte /mqtt en / antes de reenviar, que es donde escucha
    # Mosquitto. Sin ella, el broker recibiría la ruta /mqtt y rechazaría
    # el saludo.
    location /mqtt {
        proxy_pass http://broker:9001/;

        # Una conexión WebSocket empieza como HTTP y pide "promocionarse".
        # Estas tres líneas son las que dejan pasar esa promoción; sin
        # ellas nginx responde 400 y el navegador no conecta nunca.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # MQTT mantiene la conexión abierta y callada entre mensajes. Sin
        # esto, nginx la cortaría al minuto y el navegador se pasaría la
        # clase reconectando.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
