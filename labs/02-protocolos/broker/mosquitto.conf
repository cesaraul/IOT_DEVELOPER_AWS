# Configuración mínima de Mosquitto para el laboratorio.
#
# ATENCIÓN: esto es un laboratorio en localhost. En producción NUNCA se usa
# allow_anonymous ni el puerto 1883 sin TLS. Lo vemos en la clase de AWS IoT
# Core, donde cada dispositivo se autentica con su propio certificado X.509.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# Necesario para que las sesiones persistentes (clean_session=false)
# conserven los mensajes QoS 1 de un cliente desconectado.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice
log_type warning
log_type error
connection_messages true
