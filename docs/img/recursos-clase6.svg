<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Tabla de los recursos que se usan en la clase 6, con dónde vive cada uno y si es nuevo.">
<title>Los recursos que se usarán</title>
<desc>Ocho recursos. De la clase 3 vienen el objeto, el certificado y la política; de la clase 4, el dispositivo en Docker; de la clase 5, la regla de alarmas, la función Lambda y el tema de SNS. Son nuevos hoy la tabla de DynamoDB, el bucket de S3, la regla sin filtro y el rol de IAM que la autoriza.</desc>

<rect width="1000" height="500" fill="#FFFFFF"/>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif">

<!-- cabecera -->
<rect x="20" y="16" width="960" height="56" rx="10" fill="#E6F5F3"/>
<text x="38" y="51" font-size="18" font-weight="700" fill="#0B5C5C">Recurso</text>
<text x="392" y="51" font-size="18" font-weight="700" fill="#0B5C5C">Dónde vive</text>
<text x="688" y="51" font-size="18" font-weight="700" fill="#0B5C5C">¿Es nuevo hoy?</text>

<!-- fila 1 -->
<text x="38" y="105" font-size="17" fill="#16202B">Thing, certificado y política</text>
<text x="392" y="105" font-size="17" fill="#4A5663">AWS IoT Core</text>
<text x="688" y="105" font-size="17" fill="#4A5663">No, de la clase 3</text>
<line x1="20" y1="124" x2="980" y2="124" stroke="#EDEFF2" stroke-width="1.5"/>

<!-- fila 2 -->
<text x="38" y="157" font-size="17" fill="#16202B">Dispositivo en Docker</text>
<text x="392" y="157" font-size="17" fill="#4A5663">Tu laptop</text>
<text x="688" y="157" font-size="17" fill="#4A5663">No, publica igual que ayer</text>
<line x1="20" y1="176" x2="980" y2="176" stroke="#EDEFF2" stroke-width="1.5"/>

<!-- fila 3 -->
<text x="38" y="209" font-size="16" font-family="ui-monospace, Consolas, monospace" fill="#16202B">alarmas_a_otro_topic</text>
<text x="392" y="209" font-size="17" fill="#4A5663">AWS IoT Core</text>
<text x="688" y="209" font-size="17" fill="#4A5663">No. <tspan font-weight="700" fill="#16202B">Hoy no se toca</tspan></text>
<line x1="20" y1="228" x2="980" y2="228" stroke="#D9DDE3" stroke-width="2"/>

<!-- fila 4 — nueva -->
<rect x="20" y="228" width="960" height="52" fill="#F4FBFA"/>
<text x="38" y="261" font-size="17" font-weight="700" fill="#0B5C5C">Tabla de DynamoDB</text>
<text x="392" y="261" font-size="17" fill="#4A5663">Amazon DynamoDB</text>
<text x="688" y="261" font-size="17" fill="#0D6E6E"><tspan font-weight="700">Sí.</tspan> El recurso central</text>
<line x1="20" y1="280" x2="980" y2="280" stroke="#EDEFF2" stroke-width="1.5"/>

<!-- fila 5 — nueva -->
<rect x="20" y="280" width="960" height="52" fill="#F4FBFA"/>
<text x="38" y="313" font-size="17" font-weight="700" fill="#0B5C5C">Bucket de S3</text>
<text x="392" y="313" font-size="17" fill="#4A5663">Amazon S3</text>
<text x="688" y="313" font-size="17" font-weight="700" fill="#0D6E6E">Sí</text>
<line x1="20" y1="332" x2="980" y2="332" stroke="#EDEFF2" stroke-width="1.5"/>

<!-- fila 6 — nueva -->
<rect x="20" y="332" width="960" height="52" fill="#F4FBFA"/>
<text x="38" y="365" font-size="17" font-weight="700" fill="#0B5C5C">Regla nueva, <tspan fill="#D94F6E">sin WHERE</tspan></text>
<text x="392" y="365" font-size="17" fill="#4A5663">AWS IoT Core</text>
<text x="688" y="365" font-size="17" font-weight="700" fill="#0D6E6E">Sí</text>
<line x1="20" y1="384" x2="980" y2="384" stroke="#EDEFF2" stroke-width="1.5"/>

<!-- fila 7 — nueva -->
<rect x="20" y="384" width="960" height="52" fill="#F4FBFA"/>
<text x="38" y="417" font-size="17" font-weight="700" fill="#0B5C5C">Rol de IAM para esa regla</text>
<text x="392" y="417" font-size="17" fill="#4A5663">AWS IAM</text>
<text x="688" y="417" font-size="17" fill="#0D6E6E"><tspan font-weight="700">Sí.</tspan> AWS en tu nombre</text>
<line x1="20" y1="436" x2="980" y2="436" stroke="#D9DDE3" stroke-width="2"/>

<!-- fila 8 -->
<text x="38" y="469" font-size="17" fill="#16202B">Función Lambda y tema de SNS</text>
<text x="392" y="469" font-size="17" fill="#4A5663">AWS Lambda · Amazon SNS</text>
<text x="688" y="469" font-size="17" fill="#4A5663">No. Siguen solos</text>
<line x1="20" y1="488" x2="980" y2="488" stroke="#D9DDE3" stroke-width="2"/>

</g>
</svg>
