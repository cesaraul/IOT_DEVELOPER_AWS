<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="MQTT: dos dispositivos publican en un broker y el broker entrega los mensajes a la aplicación.">
<title>MQTT</title>
<desc>Dos dispositivos publican hacia un broker situado en el centro, y el broker entrega los mensajes a una aplicación. Nadie se conecta directamente con nadie: todos pasan por el broker.</desc>

<defs>
<marker id="pMqtt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0D6E6E"/></marker>
</defs>

<rect width="1000" height="480" fill="#FFFFFF"/>
<text x="500" y="76" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#0D6E6E">MQTT</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<rect x="50" y="130" width="240" height="105" rx="14" fill="#D94F6E"/>
<text x="170" y="192" font-size="27" font-weight="700" fill="#FFFFFF">Dispositivo 1</text>

<rect x="50" y="280" width="240" height="105" rx="14" fill="#D94F6E"/>
<text x="170" y="342" font-size="27" font-weight="700" fill="#FFFFFF">Dispositivo 2</text>

<rect x="400" y="170" width="200" height="175" rx="16" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="3"/>
<text x="500" y="270" font-size="30" font-weight="700" fill="#0B5C5C">Broker</text>

<rect x="710" y="205" width="240" height="105" rx="14" fill="#16202B"/>
<text x="830" y="267" font-size="27" font-weight="700" fill="#FFFFFF">Aplicación</text>
</g>

<g stroke="#0D6E6E" stroke-width="3.5" fill="none" marker-end="url(#pMqtt)">
<path d="M290 182 L 345 182 L 345 225 L 392 225"/>
<path d="M290 332 L 345 332 L 345 290 L 392 290"/>
<path d="M600 257 L 702 257"/>
</g>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="340" y="150" font-size="24" font-weight="600" fill="#16202B">publican</text>
<text x="651" y="240" font-size="24" font-weight="600" fill="#16202B">entrega</text>
</g>

<text x="500" y="430" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="25" fill="#4A5663">Nadie habla directamente con nadie: todos pasan por el broker.</text>
</svg>
