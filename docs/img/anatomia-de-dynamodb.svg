<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Una tabla de DynamoDB: solo se definen las dos claves al crearla; el resto de columnas son libres.">
<title>La anatomía de una tabla</title>
<desc>Una tabla de DynamoDB con cuatro columnas. Las dos primeras, dispositivo y momento, son las claves: se definen al crear la tabla y no se pueden cambiar. Las otras dos, nivel y temp, son libres y pueden variar de una fila a otra.</desc>

<rect width="1000" height="500" fill="#FFFFFF"/>
<text x="500" y="58" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#0D6E6E">La anatomía de una tabla</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="285" y="106" font-size="19" font-weight="600" fill="#0B5C5C">LA CLAVE · se define al crear la tabla</text>
<text x="755" y="106" font-size="19" font-weight="600" fill="#4A5663">EL RESTO · libre en cada fila</text>
</g>

<!-- cabecera -->
<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<rect x="60" y="125" width="220" height="62" rx="10" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="170" y="152" font-size="20" font-weight="700" fill="#0B5C5C">dispositivo</text>
<text x="170" y="175" font-size="15" fill="#0B5C5C">clave de partición</text>

<rect x="290" y="125" width="220" height="62" rx="10" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="400" y="152" font-size="20" font-weight="700" fill="#0B5C5C">momento</text>
<text x="400" y="175" font-size="15" fill="#0B5C5C">clave de ordenación</text>

<rect x="540" y="125" width="190" height="62" rx="10" fill="#F6F7F9" stroke="#D9DDE3" stroke-width="2"/>
<text x="635" y="163" font-size="20" font-weight="700" fill="#4A5663">nivel</text>

<rect x="740" y="125" width="190" height="62" rx="10" fill="#F6F7F9" stroke="#D9DDE3" stroke-width="2"/>
<text x="835" y="163" font-size="20" font-weight="700" fill="#4A5663">temp</text>
</g>

<!-- filas -->
<g font-family="ui-monospace, Consolas, monospace" text-anchor="middle" font-size="17" fill="#16202B">
<line x1="60" y1="205" x2="930" y2="205" stroke="#D9DDE3" stroke-width="1.5"/>

<text x="170" y="236">tanque-01</text><text x="400" y="236">2026-11-20T10:00</text><text x="635" y="236">72.4</text><text x="835" y="236">24.1</text>
<line x1="60" y1="256" x2="930" y2="256" stroke="#EDEFF2" stroke-width="1.5"/>

<text x="170" y="287">tanque-01</text><text x="400" y="287">2026-11-20T10:01</text><text x="635" y="287">78.9</text><text x="835" y="287">24.6</text>
<line x1="60" y1="307" x2="930" y2="307" stroke="#EDEFF2" stroke-width="1.5"/>

<text x="170" y="338">tanque-02</text><text x="400" y="338">2026-11-20T10:01</text><text x="635" y="338">31.0</text><text x="835" y="338">22.8</text>
<line x1="60" y1="358" x2="930" y2="358" stroke="#D9DDE3" stroke-width="1.5"/>
</g>

<text x="500" y="408" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" fill="#4A5663">La partición dice <tspan font-weight="700" fill="#16202B">de quién</tspan> es la fila. La ordenación, <tspan font-weight="700" fill="#16202B">cuándo</tspan>.</text>
<text x="500" y="444" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" fill="#4A5663">Juntas la identifican, y por eso la encuentran sin buscar.</text>
<text x="500" y="482" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" fill="#4A5663">Las demás columnas no se declaran: cada fila puede traer las suyas.</text>
</svg>
