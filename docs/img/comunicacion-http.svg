<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="HTTP: un dispositivo pregunta a un servidor y el servidor responde.">
<title>HTTP</title>
<desc>Un dispositivo y un servidor. El dispositivo pregunta y el servidor responde. El dispositivo siempre empieza la conversación.</desc>

<defs>
<marker id="pHttp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C2410C"/></marker>
</defs>

<rect width="1000" height="480" fill="#FFFFFF"/>
<text x="500" y="76" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#C2410C">HTTP</text>

<rect x="80" y="170" width="290" height="140" rx="16" fill="#D94F6E"/>
<text x="225" y="252" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Dispositivo</text>

<rect x="630" y="170" width="290" height="140" rx="16" fill="#16202B"/>
<text x="775" y="252" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Servidor</text>

<line x1="378" y1="215" x2="620" y2="215" stroke="#C2410C" stroke-width="3.5" marker-end="url(#pHttp)"/>
<text x="500" y="200" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#16202B">pregunta</text>

<line x1="622" y1="278" x2="380" y2="278" stroke="#C2410C" stroke-width="3.5" marker-end="url(#pHttp)"/>
<text x="500" y="263" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#16202B">responde</text>

<text x="500" y="400" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="25" fill="#4A5663">El dispositivo siempre empieza la conversación.</text>
</svg>
