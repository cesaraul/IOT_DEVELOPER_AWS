<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Device Shadow: el dispositivo reporta lo que es, la aplicación escribe lo que debe ser, y AWS entrega la diferencia al dispositivo.">
<title>Device Shadow</title>
<desc>Un dispositivo a la izquierda y una aplicación a la derecha, cada uno con su propia identidad. En el centro, dentro de AWS IoT Core, el shadow guarda el estado deseado y el reportado. El dispositivo reporta lo que es; la aplicación escribe lo que debe ser; AWS calcula la diferencia y se la entrega al dispositivo.</desc>

<defs>
<marker id="pSh" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0D6E6E"/></marker>
</defs>

<rect width="1000" height="540" fill="#FFFFFF"/>
<text x="500" y="66" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#0D6E6E">Device Shadow</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">

<!-- Dispositivo -->
<rect x="40" y="195" width="235" height="105" rx="14" fill="#D94F6E"/>
<text x="157" y="256" font-size="27" font-weight="700" fill="#FFFFFF">Dispositivo</text>
<text x="157" y="332" font-size="20" fill="#4A5663">certificado X.509</text>
<text x="157" y="358" font-size="20" fill="#4A5663">MQTT · puerto 8883</text>

<!-- AWS IoT Core + shadow -->
<rect x="355" y="125" width="290" height="250" rx="16" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="3"/>
<text x="500" y="163" font-size="22" font-weight="600" fill="#0B5C5C">AWS IoT Core</text>

<rect x="385" y="185" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2"/>
<text x="500" y="222" font-size="26" font-weight="700" fill="#0B5C5C">Shadow</text>
<text x="500" y="268" font-size="22" fill="#16202B">deseado</text>
<text x="500" y="300" font-size="22" fill="#16202B">reportado</text>
<text x="500" y="330" font-size="19" fill="#4A5663">un JSON, siempre ahí</text>

<!-- Aplicación -->
<rect x="725" y="195" width="235" height="105" rx="14" fill="#16202B"/>
<text x="842" y="256" font-size="27" font-weight="700" fill="#FFFFFF">Aplicación</text>
<text x="842" y="332" font-size="20" fill="#4A5663">claves de IAM</text>
<text x="842" y="358" font-size="20" fill="#4A5663">HTTPS · SDK</text>
</g>

<!-- Flechas -->
<g stroke="#0D6E6E" stroke-width="3.5" fill="none" marker-end="url(#pSh)">
<path d="M353 215 L 277 215"/>
<path d="M277 280 L 353 280"/>
<path d="M723 247 L 647 247"/>
</g>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="315" y="200" font-size="21" font-weight="600" fill="#16202B">la diferencia</text>
<text x="315" y="307" font-size="21" font-weight="600" fill="#16202B">lo que soy</text>
<text x="685" y="232" font-size="21" font-weight="600" fill="#16202B">lo que</text>
<text x="685" y="282" font-size="21" font-weight="600" fill="#16202B">debe ser</text>
</g>

<text x="500" y="440" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="25" fill="#4A5663">El dispositivo puede estar apagado: la orden espera escrita en el shadow.</text>
<text x="500" y="486" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="23" fill="#4A5663">Los dos extremos no se hablan entre sí. Solo escriben y leen el mismo estado.</text>
</svg>
