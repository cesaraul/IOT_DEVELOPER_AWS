<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="DynamoDB responde cómo está algo ahora; S3 guarda qué pasó. Cada uno responde una pregunta distinta.">
<title>Dos sitios, dos preguntas</title>
<desc>DynamoDB responde a la pregunta de cómo está algo ahora mismo: contesta en milisegundos buscando por clave, y es caro por gigabyte. S3 responde a qué pasó durante un periodo: es barato por gigabyte y se lee entero. El mismo dato va a los dos sitios porque sirven para cosas distintas.</desc>

<rect width="1000" height="520" fill="#FFFFFF"/>
<text x="500" y="58" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#0D6E6E">Dos sitios, dos preguntas</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">

<!-- DynamoDB -->
<rect x="50" y="100" width="420" height="300" rx="16" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="3"/>
<text x="260" y="146" font-size="28" font-weight="700" fill="#0B5C5C">DynamoDB</text>
<text x="260" y="186" font-size="21" font-style="italic" fill="#16202B">«¿cómo está AHORA</text>
<text x="260" y="213" font-size="21" font-style="italic" fill="#16202B">el tanque 3?»</text>

<text x="260" y="266" font-size="18" fill="#16202B">responde en milisegundos</text>
<text x="260" y="295" font-size="18" fill="#16202B">lo busca por su clave</text>
<text x="260" y="324" font-size="18" fill="#16202B">caro por gigabyte</text>
<text x="260" y="365" font-size="17" font-weight="600" fill="#0B5C5C">para la app y el tablero</text>

<!-- S3 -->
<rect x="530" y="100" width="420" height="300" rx="16" fill="#16202B"/>
<text x="740" y="146" font-size="28" font-weight="700" fill="#FFFFFF">S3</text>
<text x="740" y="186" font-size="21" font-style="italic" fill="#FFFFFF">«¿qué pasó</text>
<text x="740" y="213" font-size="21" font-style="italic" fill="#FFFFFF">en marzo?»</text>

<text x="740" y="266" font-size="18" fill="#D7E3EE">guarda todo, para siempre</text>
<text x="740" y="295" font-size="18" fill="#D7E3EE">se lee entero, no por filas</text>
<text x="740" y="324" font-size="18" fill="#D7E3EE">baratísimo por gigabyte</text>
<text x="740" y="365" font-size="17" font-weight="600" fill="#8FD6D0">para el análisis y la auditoría</text>
</g>

<text x="500" y="452" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" fill="#4A5663">El mismo dato va a los dos sitios, y no es duplicar por duplicar:</text>
<text x="500" y="486" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" fill="#4A5663">es que responden preguntas que el otro no sabe responder.</text>
</svg>
