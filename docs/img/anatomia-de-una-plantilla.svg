<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Una plantilla de CloudFormation tiene tres secciones: parámetros, recursos y salidas; y cada recurso tiene siempre la misma forma.">
<title>La anatomía de una plantilla</title>
<desc>Una plantilla de CloudFormation se divide en tres secciones. Parameters dice qué cambia de una persona a otra. Resources dice qué se crea, con un bloque por recurso. Outputs dice qué devuelve al terminar. Cada recurso tiene siempre la misma forma: un nombre que eliges tú, un tipo, y sus propiedades.</desc>

<defs>
<marker id="pPl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B9C2CC"/></marker>
</defs>

<rect width="1000" height="520" fill="#FFFFFF"/>
<text x="500" y="56" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#0D6E6E">La anatomía de una plantilla</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif">

<!-- el archivo -->
<rect x="40" y="95" width="430" height="330" rx="14" fill="#F6F7F9" stroke="#B9C2CC" stroke-width="2"/>
<text x="60" y="124" font-size="15" font-family="ui-monospace, Consolas, monospace" fill="#4A5663">clase6.yaml</text>

<rect x="62" y="140" width="386" height="80" rx="10" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="80" y="170" font-size="21" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#0B5C5C">Parameters</text>
<text x="80" y="198" font-size="16" fill="#16202B">¿qué cambia de una persona a otra?</text>

<rect x="62" y="232" width="386" height="80" rx="10" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="80" y="262" font-size="21" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#0B5C5C">Resources</text>
<text x="80" y="290" font-size="16" fill="#16202B">¿qué se crea? — un bloque por recurso</text>

<rect x="62" y="324" width="386" height="80" rx="10" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="80" y="354" font-size="21" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#0B5C5C">Outputs</text>
<text x="80" y="382" font-size="16" fill="#16202B">¿qué me devuelve al terminar?</text>

<!-- el zoom de un recurso -->
<text x="540" y="124" font-size="16" font-weight="600" fill="#4A5663">y cada recurso tiene siempre esta forma:</text>

<rect x="540" y="145" width="420" height="200" rx="12" fill="#0F1720"/>
<text x="566" y="185" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#F2819A">Tabla:</text>
<text x="590" y="217" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#6FD6C6">Type:</text>
<text x="652" y="217" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#D7E3EE">AWS::DynamoDB::Table</text>
<text x="590" y="249" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#6FD6C6">Properties:</text>
<text x="614" y="281" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#D7E3EE">TableName: ...</text>
<text x="614" y="309" font-size="18" font-family="ui-monospace, Consolas, monospace" fill="#D7E3EE">KeySchema: ...</text>

<text x="540" y="378" font-size="15" fill="#4A5663"><tspan fill="#D94F6E" font-weight="700">Tabla</tspan> es un nombre que eliges tú. Solo existe</text>
<text x="540" y="400" font-size="15" fill="#4A5663">dentro de la plantilla: sirve para que un recurso</text>
<text x="540" y="422" font-size="15" fill="#4A5663">pueda referirse a otro.</text>
</g>

<g stroke="#B9C2CC" stroke-width="2.5" fill="none" marker-end="url(#pPl)" stroke-dasharray="6 5">
<path d="M456 272 L 532 240"/>
</g>

<text x="500" y="478" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="23" fill="#4A5663">Tres secciones. Siempre las mismas, en cualquier plantilla de AWS.</text>
</svg>
