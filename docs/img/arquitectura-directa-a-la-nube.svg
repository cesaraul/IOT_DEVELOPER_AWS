<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Arquitectura IoT: tres dispositivos se conectan directamente a la nube por MQTT sobre TLS, sin gateway intermedio. En la nube: ingesta MQTT, reglas, procesamiento, base de datos, API y frontend, dashboard y alertas.">
<title>Arquitectura: dispositivos conectados directamente a la nube</title>
<desc>Tres nodos a la izquierda envían telemetría por MQTT sobre TLS directamente a la infraestructura de procesamiento y gestión en la nube, que agrupa ingesta, reglas, procesamiento, base de datos, API y frontend, dashboard y alertas. No hay gateway intermedio.</desc>

<defs>
<marker id="flecha" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#17A398"/>
</marker>
</defs>

<rect width="1200" height="700" fill="#FFFFFF"/>
<text x="600" y="56" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#3B3BAE">Arquitectura</text>
<rect x="30" y="80" width="1140" height="590" rx="10" fill="none" stroke="#E4E7EB" stroke-width="1.5"/>

<!-- ============ dispositivos ============ -->
<text x="185" y="132" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#5B6470">Dispositivos en campo</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif">
<rect x="70" y="150" width="230" height="130" rx="12" fill="#D94F6E"/>
<text x="92" y="186" font-size="22" font-weight="700" fill="#FFFFFF">Nodo 1</text>
<text x="92" y="216" font-size="15" fill="#FBE4EA">Sensores</text>
<text x="92" y="240" font-size="15" fill="#FBE4EA">Microcontrolador + radio</text>
<text x="92" y="264" font-size="15" fill="#FBE4EA">Batería + panel solar</text>

<rect x="70" y="320" width="230" height="130" rx="12" fill="#D94F6E"/>
<text x="92" y="356" font-size="22" font-weight="700" fill="#FFFFFF">Nodo 2</text>
<text x="92" y="386" font-size="15" fill="#FBE4EA">Sensores</text>
<text x="92" y="410" font-size="15" fill="#FBE4EA">Microcontrolador + radio</text>
<text x="92" y="434" font-size="15" fill="#FBE4EA">Batería + panel solar</text>

<rect x="70" y="490" width="230" height="130" rx="12" fill="#D94F6E"/>
<text x="92" y="526" font-size="22" font-weight="700" fill="#FFFFFF">Nodo 3</text>
<text x="92" y="556" font-size="15" fill="#FBE4EA">Sensores</text>
<text x="92" y="580" font-size="15" fill="#FBE4EA">Microcontrolador + radio</text>
<text x="92" y="604" font-size="15" fill="#FBE4EA">Batería + panel solar</text>
</g>

<!-- ============ enlaces directos ============ -->
<g stroke="#17A398" stroke-width="2.5" stroke-dasharray="9 7" fill="none" marker-end="url(#flecha)">
<path d="M300 215 C 440 215, 500 222, 632 228"/>
<path d="M300 385 C 440 385, 500 300, 632 248"/>
<path d="M300 555 C 440 555, 500 330, 632 268"/>
</g>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="466" y="186" font-size="17" font-weight="600" fill="#0D6E6E">MQTT sobre TLS</text>
<text x="466" y="208" font-size="14" fill="#6B7680">cada dispositivo abre su propia conexión</text>
<text x="455" y="580" font-size="15" font-weight="600" fill="#9C3BAE">Sin gateway intermedio</text>
<text x="455" y="602" font-size="13.5" fill="#6B7680">los nodos llegan solos a internet</text>
</g>

<!-- ============ nube ============ -->
<text x="890" y="138" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#5B6470">Nube · Infraestructura de procesamiento y gestión</text>
<rect x="640" y="150" width="500" height="432" rx="14" fill="none" stroke="#9C3BAE" stroke-width="2" stroke-dasharray="8 6"/>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif">
<rect x="665" y="182" width="215" height="92" rx="10" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="1.6"/>
<text x="685" y="216" font-size="19" font-weight="700" fill="#0B5C5C">Ingesta MQTT</text>
<text x="685" y="240" font-size="13.5" fill="#4A5663">autenticación por certificado</text>
<text x="685" y="259" font-size="13.5" fill="#4A5663">y conexión cifrada</text>

<rect x="900" y="182" width="215" height="92" rx="10" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.6"/>
<text x="920" y="216" font-size="19" font-weight="700" fill="#16202B">Reglas</text>
<text x="920" y="240" font-size="13.5" fill="#4A5663">filtrado y enrutamiento</text>
<text x="920" y="259" font-size="13.5" fill="#4A5663">de los mensajes</text>

<rect x="665" y="294" width="215" height="92" rx="10" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.6"/>
<text x="685" y="328" font-size="19" font-weight="700" fill="#16202B">Procesamiento</text>
<text x="685" y="352" font-size="13.5" fill="#4A5663">funciones y lógica</text>
<text x="685" y="371" font-size="13.5" fill="#4A5663">de negocio</text>

<rect x="900" y="294" width="215" height="92" rx="10" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.6"/>
<text x="920" y="328" font-size="19" font-weight="700" fill="#16202B">Base de datos</text>
<text x="920" y="352" font-size="13.5" fill="#4A5663">telemetría e históricos</text>

<rect x="665" y="406" width="215" height="92" rx="10" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.6"/>
<text x="685" y="440" font-size="19" font-weight="700" fill="#16202B">API y frontend</text>
<text x="685" y="464" font-size="13.5" fill="#4A5663">acceso de usuarios</text>

<rect x="900" y="406" width="215" height="92" rx="10" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.6"/>
<text x="920" y="440" font-size="19" font-weight="700" fill="#16202B">Dashboard</text>
<text x="920" y="464" font-size="13.5" fill="#4A5663">monitoreo en vivo</text>

<rect x="665" y="518" width="450" height="46" rx="10" fill="#FBF0FA" stroke="#9C3BAE" stroke-width="1.6"/>
<text x="890" y="547" text-anchor="middle" font-size="17" font-weight="600" fill="#7B2C9E">Alertas y notificaciones</text>
</g>

<!-- ============ flujo interno ============ -->
<g stroke="#B6BDC6" stroke-width="2" fill="none" marker-end="url(#flecha)" opacity="0.9">
<path d="M880 228 L 896 228"/>
<path d="M772 274 L 772 290"/>
<path d="M1007 274 L 1007 290"/>
<path d="M772 386 L 772 402"/>
<path d="M1007 386 L 1007 402"/>
</g>

<text x="600" y="648" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#6B7680">Cada nodo se conecta por su cuenta a la nube: no hay gateway que agregue, traduzca ni almacene en el camino.</text>
</svg>
