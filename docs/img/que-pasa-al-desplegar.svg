<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Del archivo a los recursos: la plantilla crea una pila, y la pila crea los recursos en el orden correcto. Un solo comando los borra todos.">
<title>Qué pasa al desplegar</title>
<desc>El archivo de la plantilla se despliega y crea una pila, que es el conjunto. La pila crea los cuatro recursos calculando sola el orden de dependencias: primero la tabla y el bucket, luego el rol que los necesita, y por último la regla. Un solo comando de borrado deshace todo en orden inverso.</desc>

<defs>
<marker id="pDe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0D6E6E"/></marker>
<marker id="pRo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D94F6E"/></marker>
</defs>

<rect width="1000" height="520" fill="#FFFFFF"/>
<text x="500" y="54" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#0D6E6E">Qué pasa al desplegar</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">

<!-- el archivo -->
<rect x="35" y="140" width="185" height="110" rx="14" fill="#F6F7F9" stroke="#B9C2CC" stroke-width="2.5"/>
<text x="127" y="185" font-size="18" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#16202B">clase6.yaml</text>
<text x="127" y="212" font-size="15" fill="#4A5663">lo que escribiste</text>
<text x="127" y="234" font-size="15" fill="#4A5663">tú</text>

<!-- la pila -->
<rect x="330" y="125" width="210" height="140" rx="14" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="3"/>
<text x="435" y="168" font-size="22" font-weight="700" fill="#0B5C5C">La pila</text>
<text x="435" y="196" font-size="15" fill="#16202B">«clase6»</text>
<text x="435" y="224" font-size="15" fill="#4A5663">el conjunto, con</text>
<text x="435" y="244" font-size="15" fill="#4A5663">nombre propio</text>

<!-- los recursos -->
<rect x="665" y="92" width="300" height="48" rx="10" fill="#0D6E6E"/>
<text x="815" y="123" font-size="18" font-weight="700" fill="#FFFFFF">1 · Tabla</text>

<rect x="665" y="150" width="300" height="48" rx="10" fill="#0D6E6E"/>
<text x="815" y="181" font-size="18" font-weight="700" fill="#FFFFFF">1 · Bucket</text>

<rect x="665" y="208" width="300" height="48" rx="10" fill="#16202B"/>
<text x="815" y="239" font-size="18" font-weight="700" fill="#FFFFFF">2 · Rol</text>

<rect x="665" y="266" width="300" height="48" rx="10" fill="#16202B"/>
<text x="815" y="297" font-size="18" font-weight="700" fill="#FFFFFF">3 · Regla</text>
</g>

<g stroke="#0D6E6E" stroke-width="3.5" fill="none" marker-end="url(#pDe)">
<path d="M228 195 L 322 195"/>
<path d="M548 180 L 600 180 L 600 116 L 657 116"/>
<path d="M548 192 L 612 192 L 612 174 L 657 174"/>
<path d="M548 204 L 612 204 L 612 232 L 657 232"/>
<path d="M548 216 L 600 216 L 600 290 L 657 290"/>
</g>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="275" y="178" font-size="16" font-weight="600" fill="#16202B">deploy</text>
</g>

<text x="500" y="358" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" fill="#4A5663">Tú dijiste <tspan font-weight="700" fill="#16202B">qué</tspan> querías. El <tspan font-weight="700" fill="#16202B">orden</tspan> lo calculó él: el rol necesita el ARN</text>
<text x="500" y="386" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" fill="#4A5663">de la tabla, y la regla necesita el rol.</text>

<!-- el borrado -->
<g stroke="#D94F6E" stroke-width="3.5" fill="none" marker-end="url(#pRo)" stroke-dasharray="9 6">
<path d="M960 438 L 70 438"/>
</g>
<rect x="330" y="415" width="340" height="46" rx="10" fill="#FFFFFF"/>
<text x="500" y="446" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="700" fill="#D94F6E">delete-stack</text>

<text x="500" y="494" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" fill="#4A5663">Y un solo comando lo deshace todo, en orden inverso.</text>
</svg>
