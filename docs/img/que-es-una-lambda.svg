<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="Una Lambda: tú escribes el cuerpo de la función y AWS pone la máquina, el arranque, la escala y los logs.">
<title>Qué es una Lambda</title>
<desc>Un evento entra, AWS Lambda lo recibe y ejecuta una función que escribió el usuario, y de ahí salen las acciones. Dentro del servicio solo hay una cosa escrita por el usuario: el cuerpo de la función. Todo lo demás lo pone AWS.</desc>

<defs>
<marker id="pLa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0D6E6E"/></marker>
</defs>

<rect width="1000" height="490" fill="#FFFFFF"/>
<text x="500" y="58" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#0D6E6E">Qué es una Lambda</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">

<!-- evento que entra -->
<rect x="30" y="192" width="170" height="80" rx="14" fill="#D94F6E"/>
<text x="115" y="228" font-size="22" font-weight="700" fill="#FFFFFF">evento</text>
<text x="115" y="253" font-size="15" fill="#FFFFFF">(tu mensaje)</text>

<!-- el servicio -->
<rect x="250" y="120" width="480" height="225" rx="16" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="3"/>
<text x="490" y="155" font-size="22" font-weight="600" fill="#0B5C5C">AWS Lambda</text>

<!-- lo único tuyo -->
<rect x="285" y="175" width="410" height="140" rx="12" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2"/>
<text x="490" y="205" font-size="15" fill="#4A5663">lo único que escribes tú</text>
<text x="490" y="245" font-size="19" fill="#16202B">def handler(event, context):</text>
<text x="490" y="280" font-size="19" fill="#16202B">    ...</text>

<!-- lo que sale -->
<rect x="800" y="192" width="170" height="80" rx="14" fill="#16202B"/>
<text x="885" y="238" font-size="22" font-weight="700" fill="#FFFFFF">acciones</text>
</g>

<g stroke="#0D6E6E" stroke-width="3.5" fill="none" marker-end="url(#pLa)">
<path d="M208 232 L 242 232"/>
<path d="M738 232 L 792 232"/>
</g>

<text x="500" y="398" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" fill="#4A5663">Tú escribes el cuerpo. AWS pone la máquina, el arranque,</text>
<text x="500" y="428" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="24" fill="#4A5663">la escala y los registros.</text>
<text x="500" y="466" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="23" fill="#4A5663">Si nadie la llama, no existe y no cuesta nada.</text>
</svg>
