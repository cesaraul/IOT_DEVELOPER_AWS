<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Rules Engine: el dispositivo publica telemetría, una regla dentro de AWS IoT Core filtra los mensajes y los reparte a varios destinos.">
<title>Rules Engine</title>
<desc>El dispositivo publica su telemetría en AWS IoT Core. Dentro, una regla con una consulta SQL decide qué mensajes importan y los manda a tres destinos a la vez: otro topic, una función Lambda y un correo. La regla vive en AWS y funciona sin ningún programa encendido del usuario.</desc>

<defs>
<marker id="pRe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0D6E6E"/></marker>
</defs>

<rect width="1000" height="520" fill="#FFFFFF"/>
<text x="500" y="66" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#0D6E6E">Rules Engine</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">

<!-- Dispositivo -->
<rect x="40" y="215" width="200" height="100" rx="14" fill="#D94F6E"/>
<text x="140" y="273" font-size="26" font-weight="700" fill="#FFFFFF">Dispositivo</text>

<!-- AWS IoT Core con la regla dentro -->
<rect x="320" y="140" width="280" height="250" rx="16" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="3"/>
<text x="460" y="178" font-size="22" font-weight="600" fill="#0B5C5C">AWS IoT Core</text>

<rect x="350" y="205" width="220" height="140" rx="12" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2"/>
<text x="460" y="247" font-size="26" font-weight="700" fill="#0B5C5C">Regla</text>
<text x="460" y="285" font-size="18" fill="#16202B">SELECT * FROM …</text>
<text x="460" y="312" font-size="18" fill="#16202B">WHERE alarma = true</text>

<!-- Destinos -->
<rect x="700" y="150" width="240" height="70" rx="14" fill="#16202B"/>
<text x="820" y="193" font-size="24" font-weight="700" fill="#FFFFFF">Otro topic</text>

<rect x="700" y="250" width="240" height="70" rx="14" fill="#16202B"/>
<text x="820" y="293" font-size="24" font-weight="700" fill="#FFFFFF">Lambda</text>

<rect x="700" y="350" width="240" height="70" rx="14" fill="#16202B"/>
<text x="820" y="393" font-size="24" font-weight="700" fill="#FFFFFF">Correo</text>
</g>

<!-- Flechas -->
<g stroke="#0D6E6E" stroke-width="3.5" fill="none" marker-end="url(#pRe)">
<path d="M248 265 L 312 265"/>
<path d="M604 250 L 650 250 L 650 185 L 692 185"/>
<path d="M604 285 L 692 285"/>
<path d="M604 320 L 650 320 L 650 385 L 692 385"/>
</g>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="280" y="250" font-size="20" font-weight="600" fill="#16202B">telemetría</text>
<text x="650" y="140" font-size="20" font-weight="600" fill="#16202B">una regla, varios destinos</text>
</g>

<text x="500" y="452" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="25" fill="#4A5663">La regla vive en AWS: no hay ningún programa tuyo encendido.</text>
<text x="500" y="490" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="23" fill="#4A5663">Y si la acción escribe el shadow, el equipo obedece solo. El lazo se cierra.</text>
</svg>
