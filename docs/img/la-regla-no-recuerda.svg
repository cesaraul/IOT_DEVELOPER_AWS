<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="La regla evalúa cada mensaje por separado y no recuerda los anteriores, así que vuelve a avisar en cada mensaje de alarma.">
<title>La regla no recuerda nada</title>
<desc>Tres mensajes llegan uno tras otro. La misma regla los evalúa por separado: descarta el primero, avisa con el segundo y vuelve a avisar con el tercero, porque no sabe que ya avisó. Entre una evaluación y la siguiente no hay memoria.</desc>

<defs>
<marker id="pNo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0D6E6E"/></marker>
</defs>

<rect width="1000" height="500" fill="#FFFFFF"/>
<text x="500" y="58" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#0D6E6E">La regla no recuerda nada</text>

<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">

<!-- mensaje 1 -->
<rect x="50" y="105" width="260" height="86" rx="12" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2"/>
<text x="180" y="134" font-size="15" fill="#4A5663">mensaje 1 · t = 0 s</text>
<text x="180" y="166" font-size="17" fill="#16202B">{"nivel":70,"alarma":false}</text>
<rect x="105" y="222" width="150" height="50" rx="10" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="180" y="254" font-size="21" font-weight="700" fill="#0B5C5C">Regla</text>
<text x="180" y="332" font-size="20" font-weight="700" fill="#4A5663">descarta</text>

<!-- mensaje 2 -->
<rect x="370" y="105" width="260" height="86" rx="12" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2"/>
<text x="500" y="134" font-size="15" fill="#4A5663">mensaje 2 · t = 2 s</text>
<text x="500" y="166" font-size="17" fill="#16202B">{"nivel":85,"alarma":true}</text>
<rect x="425" y="222" width="150" height="50" rx="10" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="500" y="254" font-size="21" font-weight="700" fill="#0B5C5C">Regla</text>
<text x="500" y="332" font-size="20" font-weight="700" fill="#0D6E6E">avisa</text>

<!-- mensaje 3 -->
<rect x="690" y="105" width="260" height="86" rx="12" fill="#FFFFFF" stroke="#0D6E6E" stroke-width="2"/>
<text x="820" y="134" font-size="15" fill="#4A5663">mensaje 3 · t = 4 s</text>
<text x="820" y="166" font-size="17" fill="#16202B">{"nivel":88,"alarma":true}</text>
<rect x="745" y="222" width="150" height="50" rx="10" fill="#E6F5F3" stroke="#0D6E6E" stroke-width="2.5"/>
<text x="820" y="254" font-size="21" font-weight="700" fill="#0B5C5C">Regla</text>
<text x="820" y="332" font-size="20" font-weight="700" fill="#D94F6E">avisa otra vez</text>
</g>

<g stroke="#0D6E6E" stroke-width="3" fill="none" marker-end="url(#pNo)">
<path d="M180 197 L 180 216"/>
<path d="M500 197 L 500 216"/>
<path d="M820 197 L 820 216"/>
<path d="M180 278 L 180 304"/>
<path d="M500 278 L 500 304"/>
<path d="M820 278 L 820 304"/>
</g>

<!-- sin memoria entre una evaluación y la siguiente -->
<g stroke="#B9C2CC" stroke-width="2.5" stroke-dasharray="7 6">
<path d="M265 247 L 415 247"/>
<path d="M585 247 L 735 247"/>
</g>
<g stroke="#D94F6E" stroke-width="3">
<path d="M330 237 L 350 257"/>
<path d="M350 237 L 330 257"/>
<path d="M650 237 L 670 257"/>
<path d="M670 237 L 650 257"/>
</g>
<g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="340" y="288" font-size="15" fill="#4A5663">sin memoria</text>
<text x="660" y="288" font-size="15" fill="#4A5663">sin memoria</text>
</g>

<text x="500" y="392" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="25" fill="#4A5663">La tercera no sabe que la segunda ya avisó.</text>
<text x="500" y="434" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="23" fill="#4A5663">Si el equipo publica cada 2 segundos, diez minutos de alarma</text>
<text x="500" y="464" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="23" fill="#4A5663">son 300 correos.</text>
</svg>
